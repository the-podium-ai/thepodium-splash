<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="description" content="The Podium — Plataforma de IA para sim racing. Em breve.">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Open Graph -->
  <meta property="og:title" content="The Podium">
  <meta property="og:description" content="Onde os pilotos vão para vencer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thepodium.ai">

  <title>The Podium — Em breve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(232, 0, 29, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 0, 29, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(232, 0, 29, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(232, 0, 29, 0.1);
      border: 1px solid rgba(232, 0, 29, 0.3);
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #E8001D;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease-out;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #E8001D;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(48px, 12vw, 120px);
      letter-spacing: -2px;
      line-height: 0.9;
      margin-bottom: 24px;
      animation: fadeInUp 0.8s ease-out 0.1s backwards;
    }

    .logo .red-dot { color: #E8001D; }

    .logo .ai-tag {
      color: #E8001D;
      font-style: italic;
      font-size: 0.5em;
      vertical-align: super;
      letter-spacing: -1px;
      margin-left: 4px;
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 1px;
      color: #ccc;
      margin-bottom: 12px;
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
    }

    .subtagline {
      font-size: 14px;
      color: #777;
      font-weight: 300;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 56px;
      animation: fadeInUp 0.8s ease-out 0.3s backwards;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #E8001D, transparent);
      margin: 0 auto 40px;
      animation: fadeIn 0.8s ease-out 0.4s backwards;
    }

    .form-container {
      width: 100%;
      max-width: 460px;
      animation: fadeInUp 0.8s ease-out 0.5s backwards;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 14px;
      display: block;
    }

    .form {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .input {
      flex: 1;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      outline: none;
      transition: all 0.2s ease;
    }

    .input::placeholder { color: #555; }

    .input:focus {
      border-color: #E8001D;
      background: rgba(255, 255, 255, 0.06);
    }

    .button {
      padding: 14px 24px;
      background: #E8001D;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .button:hover {
      background: #ff0020;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(232, 0, 29, 0.3);
    }

    .button:active { transform: translateY(0); }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-message {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    .form-message.success { color: #4ade80; }
    .form-message.error { color: #f87171; }

    .contact-line {
      margin-top: 28px;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.5px;
    }

    .contact-line a {
      color: #888;
      text-decoration: none;
      border-bottom: 1px dotted #444;
      transition: all 0.2s ease;
      padding-bottom: 1px;
    }

    .contact-line a:hover {
      color: #E8001D;
      border-bottom-color: #E8001D;
    }

    footer {
      padding: 32px 24px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #555;
      text-transform: uppercase;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    footer .copy { margin-bottom: 6px; }

    footer .conf {
      color: #333;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .form { flex-direction: column; }
      .button { width: 100%; padding: 16px; }
      .badge { margin-bottom: 32px; }
      .subtagline { margin-bottom: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Em Breve · 2026</div>

    <h1 class="logo">
      THE P<span class="red-dot">O</span>DIUM<span class="ai-tag">.ai</span>
    </h1>

    <p class="tagline">Onde os pilotos vão para vencer.</p>

    <p class="subtagline">
      Plataforma de inteligência artificial para sim racing.
      Treine como um pro. Pilote como um campeão.
    </p>

    <div class="divider"></div>

    <div class="form-container">
      <span class="form-label">Acesso Antecipado</span>
      <form class="form" id="signup-form" action="https://formspree.io/f/xzdylejr" method="POST">
        <input
          type="email"
          name="email"
          class="input"
          placeholder="seu@email.com"
          required
          aria-label="Email"
        >
        <button type="submit" class="button" id="submit-btn">
          Entrar na Lista
        </button>
      </form>
      <div class="form-message" id="form-message"></div>

      <p class="contact-line">
        ou escreva para <a href="mailto:hello@thepodium.ai">hello@thepodium.ai</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="copy">© 2026 The Podium</div>
    <div class="conf">Stealth mode · Confidential</div>
  </footer>

  <script>
    const form = document.getElementById('signup-form');
    const message = document.getElementById('form-message');
    const button = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      button.disabled = true;
      button.textContent = 'Enviando...';
      message.className = 'form-message';
      message.textContent = '';

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          message.className = 'form-message success';
          message.textContent = '✓ Você está na lista. Em breve, novidades.';
          form.reset();
          button.textContent = 'Entrar na Lista';
        } else {
          throw new Error('Erro ao enviar');
        }
      } catch (error) {
        message.className = 'form-message error';
        message.textContent = 'Erro ao enviar. Tente novamente.';
        button.textContent = 'Entrar na Lista';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
